<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TransFormer Anonymous Response PoC</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0; background: #f5f7fb; color: #172033; }
      main { max-width: 36rem; margin: 4rem auto; padding: 0 1rem; }
      form { display: grid; gap: 1rem; padding: 1.5rem; background: white; border-radius: 1rem; box-shadow: 0 8px 30px #22304a18; }
      label { display: grid; gap: .4rem; font-weight: 650; }
      input, textarea, button { box-sizing: border-box; width: 100%; padding: .75rem; font: inherit; border-radius: .5rem; }
      input, textarea { border: 1px solid #aab4c5; }
      textarea { min-height: 8rem; resize: vertical; }
      button { border: 0; background: #315ee7; color: white; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; }
      #status { min-height: 1.5rem; margin: 0; }
      #status[data-kind="error"] { color: #a51d2d; }
      #status[data-kind="success"] { color: #167044; }
    </style>
  </head>
  <body>
    <main>
      <h1>匿名回覆 PoC</h1>
      <p>這個頁面只用來驗證靜態網站向建立者擁有的 Google Sheet 提交資料。</p>
      <form id="poc-form">
        <label>
          姓名
          <input name="name" required maxlength="100" autocomplete="name">
        </label>
        <label>
          Email
          <input name="email" required type="email" maxlength="254" autocomplete="email">
        </label>
        <label>
          留言
          <textarea name="message" maxlength="2000"></textarea>
        </label>
        <button id="submit-button" type="submit">送出</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
